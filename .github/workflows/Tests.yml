name: Tests

on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS 26
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Swift version
        run: swift --version

      - name: Build release
        run: swift build --configuration release

      - name: Test
        run: swift test --configuration release
